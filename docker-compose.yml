services:
  # Үндсэн DB = Supabase (.env-ийн DATABASE_URL). Локал PostgreSQL хэрэгтэй бол:
  #   docker compose --profile localdb up
  db:
    image: postgres:16
    profiles: [localdb]
    env_file: .env
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:           # backend-ийн alembic DB бэлэн болохоос өмнө ажиллахаас сэргийлнэ
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  ml:
    build: ./ml            # OCR-той: build: {context: ./ml, args: {WITH_OCR: "1"}}
    ports: ["8001:8001"]
    volumes: ["./ml:/app"]

  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    # ./ml → /ml: seed (ml/csv) болон BKT параметр (ml/config) замыг config.py "/ml/..." гэж олно
    volumes: ["./backend:/app", "./ml:/ml:ro"]
    depends_on:
      db: {condition: service_healthy, required: false}  # Supabase үед db асахгүй
      minio: {condition: service_started}
      ml: {condition: service_started}

  frontend:
    build: ./frontend
    env_file: .env
    ports: ["3000:3000"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    depends_on: [backend]

volumes:
  pgdata:
  miniodata:
